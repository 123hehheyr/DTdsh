# Experimental Schedule switch over the shipped Web composition. `dsh-web-app`
# inserts the three reminder rows with `disabled: true`; this layer turns on the
# Host Schedule service and the reminder catalog only, and appends nothing, so
# enabling it cannot mount a Host service twice. The clock and the reminder
# tools belong to the `standard`, `cordis`, and `ptc` presets, which declare
# them in their own scope.

- id: schedule
  disabled: false

- id: ui-schedule
  disabled: false
