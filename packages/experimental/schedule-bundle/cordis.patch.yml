# Experimental Schedule over the shipped Web composition, which carries none of
# these rows. The Schedule service owns the task store and delivers each due
# occurrence as a follow-up in its original Session; `ui-schedule` is the task
# page and the Session reminder catalog over that service. The clock and the
# four reminder tools belong to the `standard`, `cordis`, and `ptc` presets,
# which declare them in their own scope, so this layer inserts no clock row.

- insert:
    - id: schedule
      name: '@deepseek-ai/dsh-schedule'

    - id: ui-schedule
      name: '@deepseek-ai/dsh-client-ui-schedule'
